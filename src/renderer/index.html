<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>QuickLaunch</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="panel" aria-label="QuickLaunch">
      <label class="search-shell" for="search-input">
        <span class="magnifier" aria-hidden="true"></span>
        <input
          id="search-input"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="QuickLaunch Search"
          aria-label="Search QuickLaunch"
          role="combobox"
          aria-expanded="true"
          aria-controls="results-list"
          aria-autocomplete="list"
        />
      </label>
      <section class="results-shell" aria-label="Search results">
        <div id="results-list" class="results-list" role="listbox" aria-label="Search results"></div>
      </section>
    </main>
    <script src="./index.js"></script>
  </body>
</html>
