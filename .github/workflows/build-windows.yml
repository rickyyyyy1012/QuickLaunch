name: Build QuickLaunch for Windows

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build release executable
        run: msbuild QuickLaunch.slnx /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU

      - name: Upload QuickLaunch executable
        uses: actions/upload-artifact@v4
        with:
          name: QuickLaunch-windows
          path: QuickLaunch/bin/Release/QuickLaunch.exe
          if-no-files-found: error
